###############################################################################
# android-device-matrix.yml
#
# Headless Android device testing on GitHub-hosted Ubuntu runners.
#
# Builds a debug APK once from a private repo (or downloads a prebuilt APK),
# then runs it across a matrix of virtual devices (AVD profiles x API levels)
# using hardware-accelerated emulators (KVM). No physical devices required.
#
# Evidence: ubuntu-latest runners expose /dev/kvm (verified previously).
# Cost: public repo minutes are unlimited.
#
# Dispatch example:
#   gh workflow run android-device-matrix.yml --repo codebox1230/my-builder \
#     -f private_repo=codebox1230/my-private-app \
#     -f api_levels=29,31,34 \
#     -f profiles=pixel_5,pixel_7,nexus_9
###############################################################################
name: Android Device Matrix

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: "Private repo owner/name to clone and build (empty if using apk_url)"
        required: false
        default: ""
      private_branch:
        description: "Branch, tag, or SHA of the private repo"
        required: false
        default: "main"
      apk_url:
        description: "Direct URL to a prebuilt APK (skips clone and build)"
        required: false
        default: ""
      apk_path:
        description: "APK path inside the repo (empty = auto-locate build output)"
        required: false
        default: ""
      build_command:
        description: "Custom build command (empty = ./gradlew assembleDebug)"
        required: false
        default: ""
      api_levels:
        description: "Comma-separated API levels"
        required: false
        default: "29,31,34"
      profiles:
        description: "Comma-separated AVD hardware profiles"
        required: false
        default: "pixel_5,pixel_7,nexus_9"
      target:
        description: "System image target (google_apis, default, google_apis_playstore, ...)"
        required: false
        default: "google_apis"
      test_mode:
        description: "smoke = launch + random UI; instrumentation = run androidTest APK"
        required: false
        type: choice
        options:
          - smoke
          - instrumentation
        default: smoke
      java_version:
        description: "JDK version for the Gradle build"
        required: false
        default: "17"

permissions:
  contents: read

concurrency:
  group: android-device-matrix
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Build device matrix
        id: m
        env:
          API_LEVELS: ${{ inputs.api_levels }}
          PROFILES: ${{ inputs.profiles }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          api = [x.strip() for x in os.environ["API_LEVELS"].split(",") if x.strip()]
          prof = [x.strip() for x in os.environ["PROFILES"].split(",") if x.strip()]
          if not api or not prof:
              sys.exit("api_levels and profiles must not be empty")
          include = [{"api": a, "profile": p} for a in api for p in prof]
          if len(include) > 12:
              sys.exit("matrix too large: %d jobs (max 12)" % len(include))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          print("Device matrix: %d jobs" % len(include))
          PY

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate source
        env:
          PRIVATE_REPO: ${{ inputs.private_repo }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if [ -z "$PRIVATE_REPO" ] && [ -z "$APK_URL" ]; then
            echo "::error::Provide private_repo or apk_url"
            exit 1
          fi

      - name: Download prebuilt APK
        if: inputs.apk_url != ''
        run: |
          mkdir -p apks
          curl -fsSL "${{ inputs.apk_url }}" -o apks/app.apk
          test -s apks/app.apk

      - name: Checkout private repo
        if: inputs.apk_url == ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.private_repo }}
          ref: ${{ inputs.private_branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src

      - name: Setup Java
        if: inputs.apk_url == ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Accept SDK licenses
        if: inputs.apk_url == ''
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(find "$SDK/cmdline-tools" -path "*/bin/sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
          fi

      - name: Gradle cache
        if: inputs.apk_url == ''
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        if: inputs.apk_url == ''
        working-directory: src
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            bash -c "$BUILD_COMMAND"
          elif [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "::error::No gradlew found in repo root; pass build_command"
            exit 1
          fi

      - name: Build test APK
        if: inputs.apk_url == '' && inputs.test_mode == 'instrumentation' && inputs.build_command == ''
        working-directory: src
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Collect APKs
        if: inputs.apk_url == ''
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apks"
          if [ -n "$APK_PATH" ]; then
            cp "src/$APK_PATH" "$GITHUB_WORKSPACE/apks/app.apk"
          else
            APP=$(find src -path "*/build/outputs/apk/*" -name "*.apk" ! -name "*androidTest*" | head -n 1)
            if [ -z "$APP" ]; then
              echo "::error::No APK found under src/**/build/outputs/apk"
              exit 1
            fi
            cp "$APP" "$GITHUB_WORKSPACE/apks/app.apk"
          fi
          TEST=$(find src -path "*/build/outputs/apk/*" -name "*androidTest*.apk" | head -n 1)
          if [ -n "$TEST" ]; then
            cp "$TEST" "$GITHUB_WORKSPACE/apks/app-androidTest.apk"
          fi
          ls -l "$GITHUB_WORKSPACE/apks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apks/
          if-no-files-found: error

  emulator:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    name: ${{ matrix.profile }} / API ${{ matrix.api }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Write emulator test script
        env:
          TAG: ${{ matrix.profile }}-api${{ matrix.api }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          cat > "$RUNNER_TEMP/emu-test.sh" <<'SH'
          set -euo pipefail
          LOG="logcat-${TAG}.txt"
          trap 'adb logcat -d > "$LOG" 2>/dev/null || true' EXIT

          APP_APK=$(find apks -name "app.apk" | head -n 1)
          TEST_APK=$(find apks -name "*androidTest*.apk" | head -n 1 || true)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=$(command -v aapt 2>/dev/null || true)
          if [ -z "$AAPT" ]; then
            AAPT=$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found; cannot read APK package name"
            exit 1
          fi

          PKG=$("$AAPT" dump badging "$APP_APK" | awk -F"'" '/^package: name=/{print $2; exit}')
          if [ -z "$PKG" ]; then
            echo "::error::Could not read package name from $APP_APK"
            exit 1
          fi
          echo "Package: $PKG"

          adb install -r -t "$APP_APK"
          if [ "$TEST_MODE" = "instrumentation" ]; then
            if [ -z "$TEST_APK" ]; then
              echo "::error::instrumentation mode needs an androidTest APK; build one with assembleDebugAndroidTest or switch to smoke"
              exit 1
            fi
            adb install -r -t "$TEST_APK"
            RUNNER=$(adb shell pm list instrumentation | sed -n 's/.*instrumentation:\([^ ]*\).*/\1/p' | head -n 1)
            if [ -z "$RUNNER" ]; then
              echo "::error::No instrumentation runner found in test APK"
              exit 1
            fi
            echo "Instrumentation runner: $RUNNER"
            adb shell am instrument -w -r "$RUNNER"
          else
            LAUNCH=$(adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 2>&1 || true)
            echo "$LAUNCH"
            if echo "$LAUNCH" | grep -qE "No activities found|aborted"; then
              echo "::error::App failed to launch (no launcher activity?)"
              exit 1
            fi
            adb shell monkey -p "$PKG" --pct-syskeys 0 --throttle 300 -v 300 > /dev/null 2>&1 || true
            sleep 5
          fi

          adb logcat -d > "$LOG" || true
          if grep -A5 "FATAL EXCEPTION" "$LOG" | grep -q "Process: $PKG"; then
            echo "::error::Crash detected in $PKG"
            exit 1
          fi
          if grep -q "ANR in $PKG" "$LOG"; then
            echo "::error::ANR detected in $PKG"
            exit 1
          fi
          adb exec-out screencap -p > "screenshot-${TAG}.png" || true
          SH
          chmod +x "$RUNNER_TEMP/emu-test.sh"

      - name: Run APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAG: ${{ matrix.profile }}-api${{ matrix.api }}
          TEST_MODE: ${{ inputs.test_mode }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ inputs.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$RUNNER_TEMP/emu-test.sh"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.profile }}-api${{ matrix.api }}
          path: |
            logcat-*.txt
            screenshot-*.png
          if-no-files-found: warn
