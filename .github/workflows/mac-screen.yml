###############################################################################
# mac-screen.yml
#
# Builds your code on a GitHub-hosted Mac (Azure hardware is x86/ARM cloud,
# macOS runners are real Apple Silicon Macs in GitHub's datacenter), then
# opens Apple Screen Sharing (VNC) over Tailscale for GUI verification.
#
# NOTE: macOS does not speak RDP. Remote desktop on Mac = VNC Screen Sharing
# on port 5900. From your side it looks identical: a desktop window you
# control with mouse + keyboard.
#
# Security layers (same as rdp-cloud-vm.yml):
#   1. workflow_dispatch only - forks/PRs cannot trigger
#   2. Actor validation - repo owner or ALLOWED_ACTORS only
#   3. protected-cloud environment gate
#   4. Password from VNC_PASSWORD secret, never hardcoded, never logged
#   5. Tailscale mesh only - no public ports, no public IPs
#   6. One session at a time (concurrency lock)
#   7. Build runs FIRST - screen session is for verification
#   8. if: always() cleanup - code removed, tailnet logout, sharing disabled
#
# Required secrets in public repo:
#   TAILSCALE_AUTHKEY   - ephemeral auth key from Tailscale admin panel
#   VNC_PASSWORD        - password for the 'runner' VNC login
#   ALLOWED_ACTORS      - comma-separated GitHub usernames
#   PRIVATE_REPO_TOKEN  - only needed if private_repo input is set
###############################################################################

name: Build and Verify (Mac Screen)

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: "Private repo to build (owner/name) - empty skips build"
        required: false
        default: ""
      private_branch:
        description: "Branch to build"
        required: false
        default: "main"
      build_command:
        description: "Build command override (empty = auto-detect)"
        required: false
        default: ""
      session_hours:
        description: "Max screen session hours (1-5)"
        required: false
        default: "1"
      browser_link:
        description: "Publish browser link (noVNC via Tailscale Funnel)?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: mac-screen-session
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: protected-cloud
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Validate actor identity
        id: check
        run: |
          ACTOR="${{ github.actor }}"
          OWNER="${{ github.repository_owner }}"
          ALLOWED="${{ secrets.ALLOWED_ACTORS }}"
          if [[ "$ACTOR" == "$OWNER" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Authorized: repo owner."
            exit 0
          fi
          if [[ -n "$ALLOWED" ]]; then
            IFS=',' read -ra ACTORS <<< "$ALLOWED"
            for a in "${ACTORS[@]}"; do
              a=$(echo "$a" | xargs)
              if [[ "$ACTOR" == "$a" ]]; then
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                echo "Authorized: in allowed list."
                exit 0
              fi
            done
          fi
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "DENIED: '$ACTOR' is not authorized."
          exit 1

  build-and-verify:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    # macos-15 (Sequoia) is pinned deliberately. macos-latest is now macOS 26
    # on Apple Virtualization Framework, where WindowServer exposes NO display
    # device (SPDisplaysDataType is empty), so there is no framebuffer and
    # Screen Sharing serves a black screen with only a cursor.
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      # -- 1. Clone private repo (skipped when input empty) --
      - name: Clone private repository
        if: ${{ github.event.inputs.private_repo != '' }}
        run: |
          set -euo pipefail
          REPO="${{ github.event.inputs.private_repo }}"
          BRANCH="${{ github.event.inputs.private_branch }}"
          TOKEN="${{ secrets.PRIVATE_REPO_TOKEN }}"
          if [[ -z "$TOKEN" ]]; then
            echo "PRIVATE_REPO_TOKEN secret is not set."
            exit 1
          fi
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" \
            "$HOME/workspace/private-code"
          echo "Cloned to $HOME/workspace/private-code"

      # -- 2. Build (skipped when no repo given) --
      - name: Build project
        if: ${{ github.event.inputs.private_repo != '' }}
        working-directory: ~/workspace/private-code
        run: |
          set -euo pipefail
          CMD="${{ github.event.inputs.build_command }}"
          if [[ -n "$CMD" ]]; then
            echo "Custom build: $CMD"
            eval "$CMD"
            exit 0
          fi
          if ls *.xcworkspace 1>/dev/null 2>&1; then
            SCHEME=$(xcodebuild -list -workspace *.xcworkspace 2>/dev/null \
              | awk '/Schemes:/,/^$/' | sed '1d;/^$/d' | head -1 | xargs)
            xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" \
              -configuration Release -derivedDataPath build \
              -destination 'generic/platform=macOS' build | tail -20
          elif ls *.xcodeproj 1>/dev/null 2>&1; then
            SCHEME=$(xcodebuild -list -project *.xcodeproj 2>/dev/null \
              | awk '/Schemes:/,/^$/' | sed '1d;/^$/d' | head -1 | xargs)
            xcodebuild -project *.xcodeproj -scheme "$SCHEME" \
              -configuration Release -derivedDataPath build \
              -destination 'generic/platform=macOS' build | tail -20
          elif [[ -f Package.swift ]]; then
            swift build -c release
          elif [[ -f package.json ]]; then
            [[ -f package-lock.json ]] && npm ci || npm install
            npm run build --if-present
          elif [[ -f Cargo.toml ]]; then
            cargo build --release
          elif [[ -f go.mod ]]; then
            go build -o build/output ./...
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
          elif [[ -f Makefile ]]; then
            make release 2>/dev/null || make
          else
            echo "WARNING: unknown project type, pass build_command."
          fi

      # -- 3. Upload artifacts --
      - name: Upload build artifacts
        if: ${{ github.event.inputs.private_repo != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ github.run_number }}
          path: |
            ~/workspace/private-code/build/
            ~/workspace/private-code/.build/release/
            ~/workspace/private-code/dist/
          if-no-files-found: warn
          retention-days: 30

      # -- 4. Join Tailscale network --
      - name: Connect Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: mac-builder-${{ github.run_id }}

      # -- 5. Set runner account password (REQUIRED) --
      # Apple login checks the SYSTEM account password. Without this step,
      # every login attempt fails with "Authentication failure" because the
      # fresh runner's system password is a random unknown value.
      #
      # sysadminctl needs a Secure Token and fails with "Operation is not
      # permitted without secure token unlock" on a runner whose account was
      # never unlocked graphically. Fall back to dscl, which writes the
      # password hash directly and needs no token.
      - name: Set runner account password
        run: |
          set -uo pipefail
          PW="${{ secrets.VNC_PASSWORD }}"
          if [[ -z "$PW" ]]; then
            echo "VNC_PASSWORD secret is not set."
            exit 1
          fi
          if sudo sysadminctl -resetPasswordFor runner -newPassword "$PW" 2>&1; then
            echo "System password set via sysadminctl (value masked in logs)."
          else
            echo "sysadminctl could not unlock the Secure Token; using dscl."
            sudo dscl . -passwd /Users/runner "$PW" 2>&1 || {
              echo "ERROR: could not set the runner account password."
              exit 1
            }
            echo "System password set via dscl (value masked in logs)."
          fi
          if sudo dscl . -authonly runner "$PW"; then
            echo "VERIFIED: runner password authenticates."
          else
            echo "ERROR: runner password does not authenticate."
            exit 1
          fi

      # -- 6. Enable Apple Screen Sharing (VNC, port 5900) --
      # Legacy VNC password auth is REQUIRED: without -setvnclegacy,
      # standard VNC clients (RealVNC, noVNC) fail with
      # "Security negotiation failed" against macOS native auth.
      - name: Enable Screen Sharing
        run: |
          set -euo pipefail
          PW="${{ secrets.VNC_PASSWORD }}"
          if [[ -z "$PW" ]]; then
            echo "VNC_PASSWORD secret is not set."
            exit 1
          fi
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          # BOTH auth paths accept the same VNC_PASSWORD:
          # - Apple user login (username runner + password) for native clients
          # - Legacy VNC password (password only) for standard VNC/noVNC
          #
          # The legacy password is NOT stored by -setvncpw on modern macOS
          # (verified: the server still offers VNCAuth but rejects every
          # password). It has to be written into VNCSettings.txt with the
          # XOR encoding macOS uses. The password is capped at 8 characters,
          # which is the classic VNC limit.
          LEGACY_PW="$PW"
          if [[ ${#LEGACY_PW} -gt 8 ]]; then
            LEGACY_PW="${LEGACY_PW:0:8}"
          fi
          printf '%s\n' "$LEGACY_PW" | sudo perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' \
            | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt
          echo "Legacy VNC password stored in VNCSettings.txt (value masked in logs)."

          printf '%s' "$PW" | sudo "$ARD" -activate -configure \
            -allowAccessFor -allUsers \
            -privs -all \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw "$PW" \
            -restart -agent -menu
          sleep 3

          # Screen Sharing can only capture the display if the daemon holds the
          # Screen Recording permission. Grant it directly in the TCC database
          # (SIP is disabled on hosted runners) so the framebuffer is not black.
          TCCDB="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/libexec/ARDAgent /usr/sbin/screensharingd /usr/libexec/sscreensharingd; do
            sudo sqlite3 "$TCCDB" "insert or replace into access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified) values ('kTCCServiceScreenCapture','$client',0,2,2,1,0,NULL,0,datetime('now'));" 2>/dev/null || true
          done
          sudo killall screensharingd 2>/dev/null || true
          sleep 2

          # Keep the display awake; a sleeping display renders as black.
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 2>/dev/null || true
          sudo caffeinate -dimsu -t 7200 > /dev/null 2>&1 &
          caffeinate -u -t 3 > /dev/null 2>&1 || true

          if nc -z localhost 5900 2>/dev/null; then
            echo "Screen Sharing is LISTENING on port 5900 (legacy VNC auth on)."
          else
            echo "WARNING: port 5900 check inconclusive, continuing anyway."
          fi

      # -- 6a. Display self-check --
      # A macOS runner with no display device gives a black VNC screen even
      # though auth and the port are fine. Report the state loudly instead of
      # letting the user discover a black window.
      - name: Display self-check
        run: |
          set -uo pipefail
          echo "=== display devices ==="
          system_profiler SPDisplaysDataType 2>/dev/null | head -20
          DISP=$(system_profiler SPDisplaysDataType 2>/dev/null | grep -c "Resolution" || true)
          if [[ "$DISP" -eq 0 ]]; then
            echo "::warning title=No Display::No display device is attached. Screen Sharing will show a black screen on this runner image."
          else
            echo "Display device present."
          fi
          echo "=== console user ==="
          stat -f%Su /dev/console 2>/dev/null || true
          echo "=== capture test (console session) ==="
          CU=$(stat -f%Su /dev/console 2>/dev/null)
          CU_UID=$(id -u "$CU" 2>/dev/null || echo 0)
          rm -f /tmp/display-check.png
          sudo launchctl asuser "$CU_UID" /usr/sbin/screencapture -x /tmp/display-check.png 2>&1 | head -2 || true
          if [[ -f /tmp/display-check.png ]]; then
            echo "Capture OK: $(stat -f%z /tmp/display-check.png) bytes."
          else
            echo "::warning title=Capture Failed::screencapture could not create an image; the display may not be capturable."
          fi

      # -- 6b. Enable Remote Login (SSH agent + SCP access) --
      - name: Enable Remote Login (SSH)
        run: |
          set -euo pipefail
          sudo systemsetup -setremotelogin on
          KEY="${{ secrets.SSH_PUBKEY }}"
          if [[ -n "$KEY" ]]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$KEY" > ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "Key auth installed for runner."
          else
            echo "SSH_PUBKEY not set; password auth only."
          fi
          sudo systemsetup -getremotelogin
          nc -z localhost 22 && echo "SSH port 22: OPEN"

      # -- 6c. Diagnose offered VNC auth types (ground truth) --
      # Reads the RFB handshake straight off port 5900 and prints which
      # security types the server offers. Type 2 = classic VNC password
      # (what TigerVNC needs). Types 30+ = Apple proprietary auth.
      - name: Diagnose VNC auth types
        run: |
          python3 - <<'EOF'
          import socket
          s = socket.create_connection(("localhost", 5900), timeout=10)
          ver = s.recv(12)
          print("RFB version:", ver)
          s.sendall(ver)
          data = s.recv(256)
          print("security bytes:", data.hex())
          if len(data) >= 1:
              n = data[0]
              types = list(data[1:1+n])
              print("offered security types:", types)
              print("classic VNCAuth (2) offered:", 2 in types)
          s.close()
          EOF

      # -- 6c. Browser access: noVNC + websockify + Tailscale Funnel --
      # Serves the Mac screen as a web page; Funnel publishes a public
      # https://...ts.net link you open in Chrome. No VNC client needed.
      # Best-effort: if Funnel is unavailable, VNC-over-tailnet still works.
      - name: Publish browser link
        if: github.event.inputs.browser_link == 'true'
        run: |
          set -uo pipefail
          echo "Installing websockify..."
          python3 -m pip install --quiet websockify 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages websockify \
            || echo "WARNING: websockify install failed, browser link unavailable."
          echo "Downloading noVNC client..."
          rm -rf /tmp/novnc
          if git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc 2>/dev/null; then
            echo "noVNC downloaded."
          else
            echo "WARNING: noVNC download failed, browser link unavailable."
            exit 0
          fi
          # Self-signed cert: browsers require HTTPS for the WebCrypto API
          # that Apple ARD authentication needs. Users click through
          # the one-time "not private" warning (throwaway VM, safe here).
          echo "Generating self-signed TLS certificate..."
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/novnc-key.pem -out /tmp/novnc-cert.pem \
            -days 1 -nodes -subj "/CN=mac-builder" 2>/dev/null
          echo "Starting websockify with TLS (6080 -> VNC 5900)..."
          nohup python3 -m websockify --web /tmp/novnc \
            --cert /tmp/novnc-cert.pem --key /tmp/novnc-key.pem \
            6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 3
          if nc -z localhost 6080 2>/dev/null; then
            echo "Web client listening on 6080 (HTTPS, self-signed)."
          else
            echo "WARNING: websockify did not start. Log:"
            cat /tmp/websockify.log 2>/dev/null || true
            exit 0
          fi
          # Funnel is time-boxed: run in background, poll for URL up to
          # 60s, then move on regardless so a stuck Funnel never blocks
          # the session. Direct tailnet link always works as fallback.
          echo "Publishing public link via Tailscale Funnel (60s max)..."
          tailscale funnel --bg http://localhost:6080 > /tmp/funnel.log 2>&1 || true
          FUNNEL_URL=""
          for i in $(seq 1 12); do
            sleep 5
            FUNNEL_URL=$(grep -oE 'https://[^ ]+' /tmp/funnel.log 2>/dev/null | head -1 || true)
            if [[ -n "$FUNNEL_URL" ]]; then break; fi
          done
          if [[ -n "$FUNNEL_URL" ]]; then
            echo "FUNNEL_URL=$FUNNEL_URL" >> "$GITHUB_ENV"
            echo "Browser link live: $FUNNEL_URL"
          else
            echo "WARNING: Funnel did not return a URL within 60s. Log:"
            cat /tmp/funnel.log 2>/dev/null || true
            echo "Direct tailnet link (works from your devices, no Funnel needed)"
            echo "will be printed below. If you need a public link, check in"
            echo "Tailscale admin: DNS > MagicDNS ON, HTTPS certs ON,"
            echo "Access Controls allow Funnel."
          fi

      # -- 7. Connection info --
      - name: Print connection info
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "======================================================="
          echo "  MAC SCREEN SHARING READY"
          echo "======================================================="
          echo ""
          echo "  Address:   $TS_IP"
          echo "  Port:      5900 (VNC)"
          echo "  Username:  runner"
          echo "  Password:  (your VNC_PASSWORD secret)"
          echo ""
          echo "  From WINDOWS: RealVNC Viewer / TightVNC / TigerVNC"
          echo "    -> File > New connection > $TS_IP:5900"
          echo ""
          echo "  From MAC: Finder > Cmd+K > vnc://$TS_IP"
          echo ""
          echo "  BROWSER LINK (open in Chrome, no install needed):"
          echo "    https://$TS_IP:6080/vnc.html"
          echo "    Chrome will warn 'connection is not private' (self-signed"
          echo "    cert on a throwaway VM) -> Advanced -> Proceed."
          echo "    Username: runner + your VNC_PASSWORD."
          echo ""
          if [[ -n "${FUNNEL_URL:-}" ]]; then
            echo "  PUBLIC LINK (works from any network, no Tailscale needed):"
            echo "    $FUNNEL_URL/vnc.html"
            echo ""
          fi
          echo "  Session limit: ${{ github.event.inputs.session_hours }}h"
          echo "  To end early:  Cancel workflow from Actions tab"
          echo "======================================================="

      # -- 8. Keep alive --
      - name: Screen session
        run: |
          MAX_HOURS=${{ github.event.inputs.session_hours }}
          MAX_MIN=$((MAX_HOURS * 60))
          ELAPSED=0
          echo "Screen session live for up to ${MAX_HOURS}h."
          while [[ $ELAPSED -lt $MAX_MIN ]]; do
            REMAIN=$((MAX_MIN - ELAPSED))
            echo "[$(date +%H:%M:%S)] Active - ${REMAIN}m remaining"
            sleep 300
            ELAPSED=$((ELAPSED + 5))
          done
          echo "Session limit reached. Shutting down."

      # -- 9. Secure cleanup - ALWAYS runs --
      - name: Secure cleanup
        if: always()
        run: |
          rm -rf "$HOME/workspace/private-code" 2>/dev/null || true
          echo "Private code removed."
          pkill -f websockify 2>/dev/null || true
          tailscale funnel --off 6080 2>/dev/null || true
          tailscale logout 2>/dev/null || true
          echo "Browser link closed. Tailscale disconnected."
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$ARD" -deactivate -configure -access -off 2>/dev/null || true
          echo "Screen Sharing disabled. VM will be destroyed by GitHub."
